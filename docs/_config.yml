site: Women of Open Source Community

url: https://womenofopensource.org
baseurl: ""

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /news/:slug
  partners:
    output: true
    permalink: /partners/:slug
  speakers:
    output: true
    permalink: /speakers/:slug

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
      type: "partners"
    values:
      layout: "partner"
  -
    scope:
      path: ""
      type: "speakers"
    values:
      layout: "speaker"

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-paginate
  - jekyll-sitemap

paginate: 6
paginate_path: "/news/page:num/"
