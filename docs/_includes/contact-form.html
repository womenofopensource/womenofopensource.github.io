<div class="contact-form">

	<form method="post" action="{{ site.data.settings.contact_settings.form_action }}" id="contact-form">

		<div class="contact-form__item">
			<label class="contact-form__label" for="contact-email">Email Address *</label>
			<input type="email" id="contact-email" name="email" placeholder="Your email address..." class="contact-form__input" required aria-required="true">
		</div>

		<div class="contact-form__item">
			<label class="contact-form__label" for="contact-name">Name *</label>
			<input type="text" id="contact-name" name="name" placeholder="Your name..." class="contact-form__input" required aria-required="true">
		</div>

		<div class="contact-form__item">
			<label class="contact-form__label" for="contact-message">Message *</label>
			<textarea id="contact-message" name="message" placeholder="Your message..." class="contact-form__textarea" required aria-required="true"></textarea>
		</div>

		<input type="hidden" name="_next" value="{{ site.data.settings.contact_settings.confirmation_url }}" />
		<input type="hidden" name="_subject" value="{{ site.data.settings.contact_settings.email_subject }}" />
		<input type="text" name="_gotcha" style="display: none;" class="contact-form__gotcha" value="">

	{% if site.data.settings.contact_settings.hcaptcha_sitekey %}
	<div class="contact-form__item">
		<div class="h-captcha" data-sitekey="{{ site.data.settings.contact_settings.hcaptcha_sitekey }}"></div>
	</div>
	{% endif %}

	<div class="contact-form__item">
		<input type="submit" value="{{ site.data.settings.contact_settings.send_button_text }}" class="button button--large">
	</div>

	</form>

</div>
