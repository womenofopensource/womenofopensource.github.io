<footer class="footer">

	<div class="wrap">

		<p class="footer__text">{{ site.data.settings.footer_settings.footer_tagline }}</p>

		<div class="footer__copyright">
			<span>© {{ 'now' | date: "%Y" }} {{ site.data.settings.basic_settings.site_title }}</span>
			<a href="https://jekyllthemes.io" target="_blank" rel="noopener noreferrer">Jekyll Themes</a>
		</div>

		{% if page.path %}
		<p class="footer__edit">
			<a href="{{ site.data.settings.repository_settings.url }}/edit/{{ site.data.settings.repository_settings.branch }}/docs/{{ page.path }}" target="_blank" rel="noopener noreferrer">
				<i class="fab fa-github" aria-hidden="true"></i> Edit this page on GitHub
			</a>
		</p>
		{% endif %}

		{% include socials.html %}

	</div>

</footer>
