name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN across all jobs (they only read the
# repo and handle build artifacts; nothing needs write scopes).
permissions:
  contents: read

jobs:
  build:
    name: Build + HTML proofer
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Point Bundler at docs/Gemfile from any working directory (absolute path)
      BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.4"
          bundler-cache: true

      - name: Build site
        working-directory: docs
        run: bundle exec jekyll build --strict_front_matter --trace

      - name: Install html-proofer
        run: gem install html-proofer -v '~> 5.0' --no-document

      - name: Proof HTML (internal links, images, alt text)
        run: htmlproofer docs/_site --disable-external --no-enforce-https --checks Links,Images

      - name: Upload built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: docs/_site
          retention-days: 1

  lint:
    name: Lint (JS, SCSS, Markdown, YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Verify npm package signatures
        run: npm audit signatures

      - name: ESLint (personal.js)
        run: npm run lint:js

      - name: Stylelint (SCSS)
        run: npm run lint:css

      - name: markdownlint (content)
        run: npm run lint:md

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: yamllint (config + data)
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint.yml docs/_config.yml docs/_data/

  e2e:
    name: End-to-end (desktop, tablet, mobile)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: docs/_site

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (accessibility)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: docs/_site

      - name: Run Lighthouse CI
        run: npx lhci autorun
