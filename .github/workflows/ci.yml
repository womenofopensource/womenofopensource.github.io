name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN across all jobs (they only read the
# repo and handle build artifacts; nothing needs write scopes).
permissions:
  contents: read

jobs:
  build:
    name: Build + HTML proofer
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Point Bundler at docs/Gemfile from any working directory (absolute path)
      BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          ruby-version: "3.3.4"
          bundler-cache: true

      - name: Build site
        working-directory: docs
        run: bundle exec jekyll build --strict_front_matter --trace

      - name: Install html-proofer
        run: gem install html-proofer -v '~> 5.0' --no-document

      - name: Proof HTML (internal links, images, alt text)
        run: htmlproofer docs/_site --disable-external --no-enforce-https --checks Links,Images

      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: docs/_site
          retention-days: 1

  lint:
    name: Lint (JS, SCSS, Markdown, YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Verify npm package signatures
        run: npm audit signatures

      - name: ESLint (personal.js)
        run: npm run lint:js

      - name: Stylelint (SCSS)
        run: npm run lint:css

      - name: markdownlint (content)
        run: npm run lint:md

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: yamllint (config + data)
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint.yml docs/_config.yml docs/_data/

  e2e:
    name: End-to-end (desktop, tablet, mobile)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: docs/_site

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (accessibility)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: docs/_site

      - name: Run Lighthouse CI
        run: npx lhci autorun
